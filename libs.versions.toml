[versions]
betterParse = "0.4.4"
r8 = "9.1.31"
google-datastore = "1.2.1"
android-activity-compose = "1.13.0"
sentry = "0.27.0"
buildkonfig = "0.22.0"
proguard = "7.9.1"
ktor = "3.5.1"
room = "2.8.4"
sqlite = "2.7.0"
reorderable = "3.1.0"
aboutLibraries = "15.0.4"
mcp-kotlin-sdk = "0.14.0"
compose-stability-analyzer = "0.11.1"
backdrop = "2.0.0"

[libraries]
gradlePlugins-sentry = { module = "io.sentry:sentry-kotlin-multiplatform-gradle-plugin", version.ref = "sentry" }
gradlePlugins-buildkonfig = { module = "com.codingfeline.buildkonfig:com.codingfeline.buildkonfig.gradle.plugin", version.ref = "buildkonfig" }
gradlePlugins-proguard = { module = "com.guardsquare:proguard-gradle", version.ref = "proguard" }
gradlePlugins-room = { module = "androidx.room:room-gradle-plugin", version.ref = "room" }
gradlePlugins-aboutLibraries = { module = "com.mikepenz.aboutlibraries.plugin:aboutlibraries-plugin", version.ref = "aboutLibraries" }
gradlePlugins-compose-stability-analyzer = { module = "com.github.skydoves:compose-stability-gradle", version.ref = "compose-stability-analyzer" }

betterParse = { module = "com.github.h0tk3y.betterParse:better-parse", version.ref = "betterParse" }
r8 = { module = "com.android.tools:r8", version.ref = "r8" }
google-datastore-core = { module = "androidx.datastore:datastore", version.ref = "google-datastore" }
google-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "google-datastore" }
android-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "android-activity-compose" }
ktor-network = { module = "io.ktor:ktor-network", version.ref = "ktor" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }
aboutlibraries-core = { module = "com.mikepenz:aboutlibraries-core", version.ref = "aboutLibraries" }
aboutlibraries-compose-m3 = { module = "com.mikepenz:aboutlibraries-compose-m3", version.ref = "aboutLibraries" }
mcp-kotlin-sdk-server = { module = "io.modelcontextprotocol:kotlin-sdk-server", version.ref = "mcp-kotlin-sdk" }
compose-stability-runtime = { module = "com.github.skydoves:compose-stability-runtime", version.ref = "compose-stability-analyzer" }
backdrop = { module = "io.github.kyant0:backdrop", version.ref = "backdrop" }
